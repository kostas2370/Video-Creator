# One origin for the app and the API.
#
# This is the point of putting nginx in front: with the React build and Django on the
# same origin, the auth cookies are no longer cross-site. That removes the whole class
# of problems that came from serving them separately — SameSite=Strict dropping the
# refresh token, localhost and 127.0.0.1 counting as different sites, and needing CORS
# open to every origin. The app can also call a relative /api/ and stop caring which
# host it was opened on.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. nginx resolves an upstream name once at startup, so with
    # a static `upstream` block a restarted backend container keeps its old address
    # cached and every proxied request answers 502 until nginx is restarted too.
    # Naming the target through a variable defers resolution to request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://video_creator:8000;

    # Avatar and asset uploads come through here.
    client_max_body_size 100M;

    # /static/ is claimed by two things: CRA builds to /static/js and /static/css,
    # and Django serves the admin's assets under /static/admin. Both are matched with
    # ^~, which nginx resolves by longest prefix and checks ahead of the regex below,
    # so the admin's assets reach Django and the app's own bundle does not.
    location ^~ /static/admin/ {
        proxy_pass $django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        root /usr/share/nginx/html;
        # Hashed filenames, so they can be cached hard.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rendered videos, scene images and narration audio, straight off disk. Django's
    # development static view does not implement range requests, so proxying these
    # meant a browser could not seek in a video and had to download it whole. nginx
    # answers ranges natively, and keeps Python out of the path for large files.
    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        add_header Accept-Ranges bytes;
        # Renders overwrite output_video.mp4 in place, so a cached copy would be stale.
        add_header Cache-Control "no-cache";
    }

    # Everything else Django owns. Anything unlisted falls through to the SPA.
    location ~ ^/(api|admin|swagger|redoc)(/|$) {
        proxy_pass $django;
        proxy_http_version 1.1;

        # $http_host, not $host: $host drops the port, and DRF builds absolute media
        # URLs from this header — with the port missing the browser asks for
        # http://localhost/media/... on port 80, where nothing is listening.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation and rendering take minutes; the default 60s would cut them off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # index.html must never be cached, or the browser keeps loading an old build that
    # points at bundles which no longer exist.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        # A client-side router owns these paths, so an unknown one is the app's to
        # resolve rather than a 404 — otherwise reloading on /videos/ returns nothing.
        try_files $uri $uri/ /index.html;
    }
}
