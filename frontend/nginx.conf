# One origin for the app and the API.
#
# This is the point of putting nginx in front: with the React build and Django on the
# same origin, the auth cookies are no longer cross-site. That removes the whole class
# of problems that came from serving them separately — SameSite=Strict dropping the
# refresh token, localhost and 127.0.0.1 counting as different sites, and needing CORS
# open to every origin. The app can also call a relative /api/ and stop caring which
# host it was opened on.

upstream django {
    server video_creator:8000;
}

server {
    listen 80;
    server_name _;

    # Avatar and asset uploads come through here.
    client_max_body_size 100M;

    # /static/ is claimed by two things: CRA builds to /static/js and /static/css,
    # and Django serves the admin's assets under /static/admin. Both are matched with
    # ^~, which nginx resolves by longest prefix and checks ahead of the regex below,
    # so the admin's assets reach Django and the app's own bundle does not.
    location ^~ /static/admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        root /usr/share/nginx/html;
        # Hashed filenames, so they can be cached hard.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else Django owns. Anything unlisted falls through to the SPA.
    location ~ ^/(api|admin|swagger|redoc|media)(/|$) {
        proxy_pass http://django;
        proxy_http_version 1.1;

        # Django needs the original host for ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS,
        # and the real scheme so it does not read a proxied https request as http.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation and rendering take minutes; the default 60s would cut them off.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # index.html must never be cached, or the browser keeps loading an old build that
    # points at bundles which no longer exist.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        # A client-side router owns these paths, so an unknown one is the app's to
        # resolve rather than a 404 — otherwise reloading on /videos/ returns nothing.
        try_files $uri $uri/ /index.html;
    }
}
