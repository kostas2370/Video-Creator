services:
  db:
    # 5.7 is amd64-only (no Apple Silicon image) and EOL since October 2023.
    image: mysql:8.4
    restart: always
    # Throwaway defaults so a blank .env still boots; MySQL refuses to initialise
    # without a root password. `:-` substitutes on empty as well as unset.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_creator}
      MYSQL_USER: ${MYSQL_USER:-video_creator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpassword}
    ports:
      - "3307:3307"

  video_creator:
    build: .
    stdin_open: true
    tty : true
    command: /startdjango
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./.env

  redis-stack-server:
    image: redis/redis-stack-server:latest
    container_name: redis-stack-server
    ports:
      - "6379:6379"
    restart: unless-stopped


  celery:
    build: .
    command: /startceleryworker

    volumes:
      - .:/app
    # The worker now runs generation and rendering, so it needs the same API keys and
    # database settings as the web container.
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

  celery-beat:
    build: .
    command: /startcelerybeat
    # depends_on waits for the container, not for video_creator to finish migrating,
    # so on a cold boot beat loses that race and needs to retry.
    restart: on-failure
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

