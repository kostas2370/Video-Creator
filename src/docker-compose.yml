services:
  db:
    # 5.7 is amd64-only, so it has no image for Apple Silicon, and it went EOL in
    # October 2023. 8.4 is the current LTS and ships a native linux/arm64 build.
    image: mysql:8.4
    restart: always
    # Throwaway defaults so a blank .env still boots — MySQL refuses to initialise with
    # no root password, and ENV=dev runs on sqlite anyway, so nothing connects here.
    # A real .env overrides all four (`:-` substitutes on empty as well as unset).
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_creator}
      MYSQL_USER: ${MYSQL_USER:-video_creator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpassword}
    ports:
      - "3307:3307"

  video_creator:
    build: .
    stdin_open: true
    tty : true
    command: /startdjango
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./.env

  redis-stack-server:
    image: redis/redis-stack-server:latest
    container_name: redis-stack-server
    ports:
      - "6379:6379"
    restart: unless-stopped


  celery:
    build: .
    command: /startceleryworker

    volumes:
      - .:/app
    # The worker now runs generation and rendering, so it needs the same API keys and
    # database settings as the web container.
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

  celery-beat:
    build: .
    command: /startcelerybeat
    # beat needs the django_celery_beat tables, but depends_on only waits for the
    # containers to start, not for video_creator to finish migrating. On a cold boot
    # it loses that race and exits; retrying is what lets it come up on its own.
    restart: on-failure
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

