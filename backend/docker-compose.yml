services:
  whisper:
    profiles: ["local-whisper"]
    build: ./whisper
    restart: unless-stopped
    environment:
      HF_HOME: /models
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-video_creator}
      MYSQL_USER: ${MYSQL_USER:-video_creator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpassword}
    ports:
      - "3307:3306"

  video_creator:
    build: .
    stdin_open: true
    tty : true
    command: /startdjango
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./.env

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      - video_creator

  redis-stack-server:
    image: redis/redis-stack-server:latest
    container_name: redis-stack-server
    ports:
      - "6379:6379"
    restart: unless-stopped


  celery:
    build: .
    command: /startceleryworker

    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

  celery-render:
    build: .
    command: /startceleryrender
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

  celery-beat:
    build: .
    command: /startcelerybeat
    restart: on-failure
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - redis-stack-server
      - db

volumes:
  whisper-models:
