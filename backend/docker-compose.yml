services:
  whisper:
    profiles: ["local-whisper"]
    build: ./whisper
    restart: unless-stopped
    environment:
      HF_HOME: /models
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
    volumes:
      - whisper-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_creator}
      POSTGRES_USER: ${POSTGRES_USER:-video_creator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  video_creator:
    build: .
    stdin_open: true
    tty : true
    command: /startdjango
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      - video_creator

  redis-stack-server:
    image: redis/redis-stack-server:latest
    container_name: redis-stack-server
    restart: unless-stopped


  celery:
    build: .
    command: /startceleryworker

    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis-stack-server:
        condition: service_started
      postgres:
        condition: service_healthy

  celery-render:
    build: .
    command: /startceleryrender
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis-stack-server:
        condition: service_started
      postgres:
        condition: service_healthy

  celery-beat:
    build: .
    command: /startcelerybeat
    restart: on-failure
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis-stack-server:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  whisper-models:
  postgres-data:
